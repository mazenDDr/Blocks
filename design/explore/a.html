<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocks — reference_cnn (exploration A: marble run)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ground: oklch(97.6% 0.008 230);   /* #F3F7FA morning light on a play-room floor */
  --track: oklch(90% 0.03 75);        /* #EBDDC6 pale beech track */
  --track-edge: oklch(80% 0.045 70);  /* #D6BF9C track rail */
  --piece: oklch(100% 0 0);
  --ink: oklch(25% 0.02 240);         /* #1E2A33 */
  --ink-2: oklch(45% 0.02 240);       /* #55626C — 6.1:1 on ground */
  --rule: oklch(90% 0.01 230);
  --accent: #007ACC;                  /* VS Code blue: the marble and the one action */
  --accent-soft: oklch(93% 0.035 240);
  --r-piece: 18px; --r-panel: 22px; --r-btn: 999px;
  --f: "M PLUS Rounded 1c", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);color:var(--ink);background:var(--ground);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
.app{position:relative;min-height:100vh;overflow:hidden}
.canvas{position:absolute;inset:0}
.float{position:absolute;background:var(--piece);border:1px solid var(--rule);border-radius:var(--r-panel);box-shadow:0 6px 24px -12px oklch(30% 0.03 240 / .25)}
.brand{left:16px;top:16px;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-2);font-size:13px}
.tools{left:50%;top:16px;transform:translateX(-50%);display:flex;gap:4px;padding:6px}
.tool{min-width:44px;height:44px;border-radius:14px;border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;cursor:pointer;color:var(--ink-2)}
.tool[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.tool:hover{background:oklch(95% 0.01 230)}
.run{right:16px;top:16px;display:flex;gap:8px;padding:6px;align-items:center}
.primary{height:44px;border-radius:var(--r-btn);border:1px solid transparent;background:var(--accent);color:#fff;font-weight:700;padding:0 20px;display:flex;align-items:center;gap:8px;cursor:pointer}
.ghost{height:44px;border-radius:var(--r-btn);border:1px solid var(--rule);background:var(--piece);padding:0 16px;cursor:pointer}
.library{left:16px;top:96px;width:236px;padding:14px;display:flex;flex-direction:column;gap:12px}
.library h2,.inspector h2{margin:0;font-size:15px;font-weight:800}
.search{display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--rule);border-radius:12px;padding:0 10px;color:var(--ink-2)}
.search input{border:0;outline:none;background:none;font:inherit;flex:1;min-width:0}
.shelf{display:flex;flex-direction:column;gap:6px}
.shelf p{margin:6px 0 0;font-size:13px;color:var(--ink-2);font-weight:700}
.chip{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:12px;background:var(--ground);cursor:grab;font-weight:500}
.chip i{width:22px;height:14px;border-radius:7px;background:var(--track);border:2px solid var(--track-edge)}
.inspector{right:16px;top:96px;width:280px;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500}
.field input{height:40px;border:1px solid var(--rule);border-radius:12px;padding:0 12px;font:inherit;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shape{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:14px}
.shape span:first-child{color:var(--ink-2)}
.status{left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:999px}
.bar{width:180px;height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.bar span{display:block;height:100%;width:64%;background:var(--accent);border-radius:4px}
/* pieces */
.piece{fill:var(--piece);stroke:var(--track-edge);stroke-width:2}
.piece.sel{stroke:var(--accent);stroke-width:3}
.groove{fill:var(--track)}
.pname{font:800 15px var(--f);fill:var(--ink)}
.pmeta{font:500 13px var(--f);fill:var(--ink-2);font-variant-numeric:tabular-nums}
.rail{fill:none;stroke:var(--track-edge);stroke-width:14;stroke-linecap:round}
.bed{fill:none;stroke:var(--track);stroke-width:10;stroke-linecap:round}
.marble{offset-path:path("M210 330 C 260 330 260 330 300 330 L 450 330 C 490 330 490 330 530 330 L 690 330 C 760 330 760 520 690 520 L 520 520 L 360 520 C 320 520 320 520 300 520");offset-rotate:0deg;offset-distance:46%}
@media (prefers-reduced-motion: no-preference){
  .marble{animation:roll 9s cubic-bezier(.45,.05,.35,1) infinite}
  @keyframes roll{0%{offset-distance:0%}8%{offset-distance:0%}92%{offset-distance:100%}100%{offset-distance:100%}}
}
@media (max-width:820px){
  .library,.tools{display:none}
  .inspector{left:12px;right:12px;top:auto;bottom:84px;width:auto}
  .run .ghost{display:none}
  .status{bottom:12px;left:12px;right:12px;transform:none;justify-content:space-between}
  .bar{flex:1}
  .canvas svg{transform:translate(-170px,-140px) scale(.82);transform-origin:0 0}
}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <svg class="canvas" width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="reference_cnn: images, conv_1, pool_1, conv_2, pool_2, fc, joined by a track; a sample marble is rolling through">
    <path class="rail" d="M210 330 L 690 330 C 760 330 760 520 690 520 L 300 520"></path>
    <path class="bed" d="M210 330 L 690 330 C 760 330 760 520 690 520 L 300 520"></path>
    <g transform="translate(300 286)"><rect class="piece" width="150" height="88" rx="18"></rect><rect class="groove" x="0" y="38" width="150" height="12"></rect><text class="pname" x="16" y="28">images</text><text class="pmeta" x="16" y="74">N×3×64×64</text></g>
    <g transform="translate(530 286)"><rect class="piece" width="160" height="88" rx="18"></rect><rect class="groove" x="0" y="38" width="160" height="12"></rect><text class="pname" x="16" y="28">conv_1</text><text class="pmeta" x="16" y="74">32 filters · 896</text></g>
    <g transform="translate(760 286)"><rect class="piece" width="150" height="88" rx="18"></rect><rect class="groove" x="0" y="38" width="150" height="12"></rect><text class="pname" x="16" y="28">pool_1</text><text class="pmeta" x="16" y="74">N×32×32×32</text></g>
    <g transform="translate(520 476)"><rect class="piece sel" width="170" height="88" rx="18"></rect><rect class="groove" x="0" y="38" width="170" height="12"></rect><text class="pname" x="16" y="28">conv_2</text><text class="pmeta" x="16" y="74">64 filters · 18,496</text></g>
    <g transform="translate(300 476)"><rect class="piece" width="150" height="88" rx="18"></rect><rect class="groove" x="0" y="38" width="150" height="12"></rect><text class="pname" x="16" y="28">pool_2</text><text class="pmeta" x="16" y="74">N×64×16×16</text></g>
    <g transform="translate(150 476)"><rect class="piece" width="120" height="88" rx="18"></rect><rect class="groove" x="0" y="38" width="120" height="12"></rect><text class="pname" x="16" y="28">fc</text><text class="pmeta" x="16" y="74">10 classes</text></g>
    <g class="marble"><circle r="11" fill="#007ACC"></circle><circle cx="-4" cy="-4" r="3.5" fill="#fff" opacity=".8"></circle></g>
  </svg>

  <header class="float brand">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="15" width="16" height="16" rx="5" fill="#007ACC"></rect><rect x="21" y="9" width="16" height="16" rx="5" fill="#007ACC" opacity=".55"></rect><rect x="12" y="4" width="16" height="9" rx="4.5" fill="#1E2A33"></rect></svg>
    <div><b>Blocks</b><small>reference_cnn · saved</small></div>
  </header>

  <nav class="float tools" aria-label="Canvas tools">
    <button class="tool" aria-pressed="true" aria-label="Select">Select</button>
    <button class="tool" aria-pressed="false">Add block</button>
    <button class="tool" aria-pressed="false">Connect</button>
    <button class="tool" aria-pressed="false">Tidy up</button>
    <button class="tool" aria-pressed="false" aria-label="More tools">⋯</button>
  </nav>

  <div class="float run">
    <button class="ghost">Data</button>
    <button class="primary">Roll a sample</button>
  </div>

  <aside class="float library" aria-label="Pieces">
    <h2>Pieces</h2>
    <label class="search"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search pieces</span><input type="search" placeholder="Find a piece"></label>
    <div class="shelf"><p>Layers</p><div class="chip"><i></i>Conv2d</div><div class="chip"><i></i>Linear</div><div class="chip"><i></i>Attention</div></div>
    <div class="shelf"><p>Shape</p><div class="chip"><i></i>MaxPool2d</div><div class="chip"><i></i>Flatten</div></div>
    <div class="shelf"><p>Structure</p><div class="chip"><i></i>Repeat</div><div class="chip"><i></i>Module</div></div>
  </aside>

  <aside class="float inspector" aria-label="conv_2 settings">
    <h2>conv_2 <span style="font-weight:500;color:var(--ink-2)">· Conv2d</span></h2>
    <div class="grid2">
      <label class="field">Filters<input value="64"></label>
      <label class="field">Kernel<input value="3 × 3"></label>
      <label class="field">Stride<input value="1"></label>
      <label class="field">Padding<input value="same"></label>
    </div>
    <div class="shape"><span>In</span><span>N × 32 × 32 × 32</span></div>
    <div class="shape"><span>Out</span><span>N × 64 × 32 × 32</span></div>
    <div class="shape"><span>Parameters</span><span>18,496</span></div>
  </aside>

  <div class="float status" role="status">
    <strong>Training</strong><span class="bar" aria-hidden="true"><span></span></span><span style="color:var(--ink-2);font-variant-numeric:tabular-nums">epoch 2 of 2 · loss 1.84</span>
  </div>
</div>
</body>
</html>
