[project]
name = "project-void"
version = "0.0.0"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services"]
markers = ["live: needs a running local Ollama server with the models named in the test (run with: pytest -m live)",
           "gpu: needs a usable CUDA device (run on the GPU machine with: pytest -m gpu)"]
addopts = "-m 'not live and not gpu'"
