<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d"><title id="t">How Blocks runs on your machine</title><desc id="d">The editor in the browser talks to a local control service over HTTP. The control service validates graphs, stores projects and starts worker processes for runs. Workers execute on PyTorch, Keras 3 or JAX, scikit-learn and SciPy, LangGraph, or Gymnasium, and stream events back. Everything is recorded in the workbench folder: a SQLite database and content-addressed artifacts.</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#fcfcfb} .title{font-size:22px;font-weight:600;fill:#0b0b0b} .sub{font-size:14px;fill:#52514e}
.box{fill:#ffffff;stroke:#c9c8c3;stroke-width:1.5} .h{font-size:15px;font-weight:600;fill:#0b0b0b} .s{font-size:12.5px;fill:#52514e}
.chip{fill:#f1f0ec;stroke:#e3e2dd} .ct{font-size:12px;fill:#0b0b0b;font-weight:500}
.ln{stroke:#2a78d6;stroke-width:2;fill:none;marker-end:url(#a)} .ret{stroke:#1baf7a;stroke-width:2;fill:none;stroke-dasharray:5 5;marker-end:url(#b)}
.dot{fill:#2a78d6} .dot2{fill:#1baf7a} .lab{font-size:12px;fill:#52514e}
@keyframes go{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.m1{offset-path:path('M190 146 H262');animation:go 1.2s ease-in-out 0.4s infinite}
.m2{offset-path:path('M430 146 H502');animation:go 1.2s ease-in-out 0.9s infinite}
.m3{offset-path:path('M502 172 H430');animation:go 1.2s ease-in-out 1.6s infinite}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19} .title,.h,.ct{fill:#ffffff} .sub,.s,.lab{fill:#c3c2b7} .box{fill:#232322;stroke:#4a4945} .chip{fill:#2c2c2a;stroke:#4a4945} .ln{stroke:#3987e5} .dot{fill:#3987e5}}
@media (prefers-reduced-motion:reduce){.m1,.m2,.m3{animation:none!important;display:none}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1baf7a"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="300" rx="12"/>
<text x="24" y="38" class="title">Everything runs on your machine</text>
<text x="24" y="60" class="sub">One editor, one local service, worker processes for runs, and a record of everything that happened.</text>
<rect class="box" x="24" y="96" width="166" height="128" rx="12"/><text x="40" y="124" class="h">Editor</text><text x="40" y="146" class="s">React · React Flow</text><text x="40" y="164" class="s">build, inspect, compare</text><text x="40" y="182" class="s">localhost:5173</text>
<rect class="box" x="264" y="96" width="166" height="128" rx="12"/><text x="280" y="124" class="h">Control service</text><text x="280" y="146" class="s">FastAPI</text><text x="280" y="164" class="s">validates graphs,</text><text x="280" y="182" class="s">stores projects,</text><text x="280" y="200" class="s">starts runs · :8000</text>
<rect class="box" x="504" y="96" width="232" height="128" rx="12"/><text x="520" y="124" class="h">Worker processes</text>
<rect class="chip" x="520" y="136" width="98" height="24" rx="12"/><text x="569" y="152" text-anchor="middle" class="ct">PyTorch · JAX</text>
<rect class="chip" x="624" y="136" width="96" height="24" rx="12"/><text x="672" y="152" text-anchor="middle" class="ct">Keras 3</text>
<rect class="chip" x="520" y="164" width="98" height="24" rx="12"/><text x="569" y="180" text-anchor="middle" class="ct">scikit-learn</text>
<rect class="chip" x="624" y="164" width="96" height="24" rx="12"/><text x="672" y="180" text-anchor="middle" class="ct">LangGraph</text>
<rect class="chip" x="520" y="192" width="98" height="24" rx="12"/><text x="569" y="208" text-anchor="middle" class="ct">Gymnasium</text>
<rect class="chip" x="624" y="192" width="96" height="24" rx="12"/><text x="672" y="208" text-anchor="middle" class="ct">SciPy · pandas</text>
<path class="ln" d="M190 146 H262"/><text x="196" y="138" class="lab">HTTP</text>
<path class="ln" d="M430 146 H502"/><text x="436" y="138" class="lab">run</text>
<path class="ret" d="M502 172 H432"/><text x="436" y="190" class="lab">events</text>
<circle class="dot m1" r="5"/><circle class="dot m2" r="5"/><circle class="dot2 m3" r="5"/>
<rect class="box" x="264" y="244" width="472" height="40" rx="12"/><text x="280" y="269" class="h">Workbench</text><text x="372" y="269" class="s">.workbench/ · SQLite records + content-addressed artifacts</text>
<path class="ret" d="M347 224 V242"/><path class="ret" d="M620 224 V242"/>
</svg>
