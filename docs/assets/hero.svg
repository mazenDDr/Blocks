.b{opacity:0;animation:pop .35s ease-out both} .w{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .3s ease-out both}
.f{opacity:0;animation:fade .4s ease-out both} .c{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s linear 3.4s both}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19} .title,.name,.num{fill:#ffffff} .sub,.shape,.lab{fill:#c3c2b7} .blk{fill:#232322;stroke:#4a4945} .wire{stroke:#3987e5} .pulse{fill:#3987e5} .axis{stroke:#3a3936} .loss{stroke:#199e70} .acc{stroke:#b06be8}}
