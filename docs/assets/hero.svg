<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="t d"><title id="t">Blocks: a model built from blocks, checked, then trained</title><desc id="d">The reference CNN from the examples: ten blocks appear and wire themselves together, every wire shows its tensor shape, the parameter count adds up to 20,042, then a real training run plays: the loss falls and the validation accuracy rises to 77.5% on the synthetic shapes data.</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#fcfcfb} .title{font-size:22px;font-weight:600;fill:#0b0b0b} .sub{font-size:14px;fill:#52514e}
