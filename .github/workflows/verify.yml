name: Native checks and editor smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_only:
        description: 'Run only actual browser journeys for diagnosis (not full release verification)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.browser_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
      - name: Install pinned environments
        run: |
          npm install --global pnpm@10.33.0
          python -m venv .venv
          .venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu -r python/requirements.txt
          .venv/bin/pip install -e . --no-deps
          .venv/bin/python -m connectors.install_pgserver
          python -m venv .venv-trackers
          .venv-trackers/bin/pip install -r python/tracking/requirements.txt
          pnpm -C apps/editor install --frozen-lockfile
      - name: Native suite (live Ollama is separately verified on the Mac)
        run: .venv/bin/pytest -q -o faulthandler_timeout=240 --junitxml=/tmp/void-pytest.xml
      - name: Editor build and coverage
        run: |
          pnpm -C apps/editor build
          pnpm -C apps/editor exec tsc --noEmit
          node --test apps/editor/tests/*.test.mjs
          .venv/bin/python -m backends.coverage --check
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-evidence
          path: /tmp/void-pytest.xml
          if-no-files-found: warn
          retention-days: 7

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
      - name: Install pinned environments
        id: install
        run: |
          npm install --global pnpm@10.33.0
          python -m venv .venv
          .venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu -r python/requirements.txt
          .venv/bin/pip install -e . --no-deps
          .venv/bin/python -m connectors.install_pgserver
          python -m venv .venv-trackers
          .venv-trackers/bin/pip install -r python/tracking/requirements.txt
          pnpm -C apps/editor install --frozen-lockfile
      - name: Real browser graph draft history
        run: .venv/bin/python tools/editor_history_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-history-smoke
      - name: Real browser graph clipboard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_clipboard_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-clipboard-smoke
      - name: Real browser structured graph outline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_outline_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-outline-smoke
      - name: Real browser measured graph arrangement
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_arrangement_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-arrangement-smoke
      - name: Real browser authored node comments
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_comments_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-comments-smoke
      - name: Real browser explicit typed wire insertion
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_insertion_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-insertion-smoke
      - name: Real browser existing editor commands
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_commands_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-commands-smoke
      - name: Real browser selected-group layout movement
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_movement_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-movement-smoke
      - name: Real browser module-definition clipboard transfer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_module_clipboard_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-module-clipboard-smoke
      - name: Real browser native diagnostic scope navigation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_diagnostic_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-diagnostic-smoke
      - name: Real browser specialized native agent outline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_agent_outline_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-agent-outline-smoke
      - name: Real browser native agent clipboard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_agent_clipboard_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-agent-clipboard-smoke
      - name: Real browser specialized native RL outline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_rl_outline_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-rl-outline-smoke
      - name: Real browser opt-in automatic cache retention
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/editor_cache_retention_smoke.py --chrome /usr/bin/google-chrome --output /tmp/void-ci-cache-retention-smoke
      - name: Real browser, backup and restored native state journey
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python tools/recovery_smoke.py --trackers --cache-retention --gc --chrome /usr/bin/google-chrome --output /tmp/void-ci-recovery-smoke
      - name: Preserve actual test evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            /tmp/void-ci-cache-retention-smoke/runner.json
            /tmp/void-ci-cache-retention-smoke/evidence.json
            /tmp/void-ci-cache-retention-smoke/*.log
            /tmp/void-ci-cache-retention-smoke/*.png
            /tmp/void-ci-recovery-smoke/cache-seed/runner.json
            /tmp/void-ci-recovery-smoke/cache-seed/evidence.json
            /tmp/void-ci-recovery-smoke/cache-seed/*.log
            /tmp/void-ci-recovery-smoke/cache-seed/*.png
            /tmp/void-ci-recovery-smoke/cache-check/runner.json
            /tmp/void-ci-recovery-smoke/cache-check/evidence.json
            /tmp/void-ci-recovery-smoke/cache-check/*.log
            /tmp/void-ci-recovery-smoke/cache-check/*.png
            /tmp/void-ci-recovery-smoke/recovery.json
            /tmp/void-ci-recovery-smoke/trackers.json
            /tmp/void-ci-recovery-smoke/seed/runner.json
            /tmp/void-ci-recovery-smoke/seed/evidence.json
            /tmp/void-ci-recovery-smoke/seed/*.log
            /tmp/void-ci-recovery-smoke/seed/*.png
            /tmp/void-ci-recovery-smoke/check/runner.json
            /tmp/void-ci-recovery-smoke/check/evidence.json
            /tmp/void-ci-recovery-smoke/check/*.log
            /tmp/void-ci-recovery-smoke/check/*.png
            /tmp/void-ci-history-smoke/runner.json
            /tmp/void-ci-history-smoke/evidence.json
            /tmp/void-ci-history-smoke/*.log
            /tmp/void-ci-history-smoke/*.png
            /tmp/void-ci-clipboard-smoke/runner.json
            /tmp/void-ci-clipboard-smoke/evidence.json
            /tmp/void-ci-clipboard-smoke/*.log
            /tmp/void-ci-clipboard-smoke/*.png
            /tmp/void-ci-outline-smoke/runner.json
            /tmp/void-ci-outline-smoke/evidence.json
            /tmp/void-ci-outline-smoke/*.log
            /tmp/void-ci-outline-smoke/*.png
            /tmp/void-ci-arrangement-smoke/runner.json
            /tmp/void-ci-arrangement-smoke/evidence.json
            /tmp/void-ci-arrangement-smoke/*.log
            /tmp/void-ci-arrangement-smoke/*.png
            /tmp/void-ci-comments-smoke/runner.json
            /tmp/void-ci-comments-smoke/evidence.json
            /tmp/void-ci-comments-smoke/*.log
            /tmp/void-ci-comments-smoke/*.png
            /tmp/void-ci-insertion-smoke/runner.json
            /tmp/void-ci-insertion-smoke/evidence.json
            /tmp/void-ci-insertion-smoke/*.log
            /tmp/void-ci-insertion-smoke/*.png
            /tmp/void-ci-commands-smoke/runner.json
            /tmp/void-ci-commands-smoke/evidence.json
            /tmp/void-ci-commands-smoke/*.log
            /tmp/void-ci-commands-smoke/*.png
            /tmp/void-ci-movement-smoke/runner.json
            /tmp/void-ci-movement-smoke/evidence.json
            /tmp/void-ci-movement-smoke/*.log
            /tmp/void-ci-movement-smoke/*.png
            /tmp/void-ci-module-clipboard-smoke/runner.json
            /tmp/void-ci-module-clipboard-smoke/evidence.json
            /tmp/void-ci-module-clipboard-smoke/*.log
            /tmp/void-ci-module-clipboard-smoke/*.png
            /tmp/void-ci-diagnostic-smoke/runner.json
            /tmp/void-ci-diagnostic-smoke/evidence.json
            /tmp/void-ci-diagnostic-smoke/*.log
            /tmp/void-ci-diagnostic-smoke/*.png
            /tmp/void-ci-agent-outline-smoke/runner.json
            /tmp/void-ci-agent-outline-smoke/evidence.json
            /tmp/void-ci-agent-outline-smoke/*.log
            /tmp/void-ci-agent-outline-smoke/*.png
            /tmp/void-ci-agent-clipboard-smoke/runner.json
            /tmp/void-ci-agent-clipboard-smoke/evidence.json
            /tmp/void-ci-agent-clipboard-smoke/*.log
            /tmp/void-ci-agent-clipboard-smoke/*.png
            /tmp/void-ci-rl-outline-smoke/runner.json
            /tmp/void-ci-rl-outline-smoke/evidence.json
            /tmp/void-ci-rl-outline-smoke/*.log
